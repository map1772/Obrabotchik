---
- name: Настройка веб-сервера Nginx
  hosts: web
  become: true

  vars:
    root_dir: /var/www/my_site
    nginx_port: 8081
    app_name: "My First App"

  tasks:
    - name: Установка Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Запуск и включение автозагрузки Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Создание корневого каталога сайта
      ansible.builtin.file:
        path: "{{ root_dir }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Формирование конфигурации Nginx
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/sites-enabled/default
        mode: "0644"
      notify: Reload nginx config

    - name: Формирование главной страницы index.html
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: "{{ root_dir }}/index.html"
        mode: "0644"

  handlers:
    - name: Reload nginx config
      ansible.builtin.service:
        name: nginx
        state: reloaded
